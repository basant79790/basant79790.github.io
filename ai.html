<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | Er. Basant Adhikari</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .ai-card {
            width: 95%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 25px;
            border: 2px solid #ec4899; /* Pink Border */
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(236, 72, 153, 0.2);
        }
        .ai-header {
            background: #ec4899; /* Pink Header */
            padding: 20px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .chat-box {
            height: 380px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
        }
        .msg {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 14.5px;
            line-height: 1.5;
        }
        .bot { 
            background: #334155; 
            align-self: flex-start; 
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
        }
        .user { 
            background: #ec4899; /* User Msg Pink */
            align-self: flex-end; 
            color: white;
            border-bottom-right-radius: 2px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #1e293b;
            gap: 10px;
        }
        input {
            flex: 1;
            background: #334155;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 10px;
            color: white;
            outline: none;
        }
        input:focus {
            border-color: #ec4899;
        }
        button {
            background: #ec4899;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background: #be185d;
        }
        .back-btn {
            text-align: center;
            padding: 10px;
            font-size: 13px;
            background: #1e293b;
        }
        a { color: #ec4899; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="ai-card">
    <div class="ai-header">Basant Adhikari Engineering Ai Bot 🤖</div>
    <div id="chat" class="chat-box">
        <div class="msg bot">नमस्ते! म बासन्तको AI सहायक हुँ। म तपाईंलाई घरको नक्सा, डिजाइन वा कन्स्ट्रक्सनको बारेमा के मद्दत गर्न सक्छु?</div>
    </div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="यहाँ प्रश्न लेख्नुहोस्..." onkeypress="handleEnter(event)">
        <button onclick="sendMsg()">Send</button>
    </div>
    <div class="back-btn">
        <a href="index.html">← मुख्य वेबसाइटमा फर्कनुहोस्</a>
    </div>
</div>

<script>
    function handleEnter(event) {
        if (event.key === "Enter") sendMsg();
    }

    function sendMsg() {
        let input = document.getElementById('msgInput');
        let chat = document.getElementById('chat');
        if (input.value.trim() === "") return;

        chat.innerHTML += `<div class="msg user">${input.value}</div>`;
        let text = input.value.toLowerCase();
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        setTimeout(() => {
            let reply = "माफ गर्नुहोला, मैले बुझिन। थप जानकारीको लागि बासन्त जीलाई सिधै सम्पर्क गर्नुहोला।";
            
            if(text.includes("नक्सा") || text.includes("map") || text.includes("design") || text.includes("नक्शा")) {
                reply = "बासन्त जीले नगरपालिकाको मापदण्ड अनुसार घरको नक्सा पास र २डी/३डी डिजाइन बनाउनुहुन्छ।";
            } else if(text.includes("सम्पर्क") || text.includes("number") || text.includes("contact") || text.includes("फोन") || text.includes("phone")) {
                reply = "तपाईंले उहाँलाई सिधै **9745415129** मा फोन गर्न सक्नुहुन्छ वा WhatsApp मा म्यासेज छोड्न सक्नुहुन्छ।";
            } else if(text.includes("खर्च") || text.includes("cost") || text.includes("estimate") || text.includes("पैसा")) {
                reply = "घर बनाउने खर्च डिजाइन र क्षेत्रफलमा भर पर्छ। बासन्त जीले तपाईंलाई यसको विस्तृत 'Valuation' र 'Estimate' गरिदिनुहुनेछ।";
            } else if(text.includes("नमस्ते") || text.includes("hello") || text.includes("hi")) {
                reply = "नमस्ते! भन्नुहोस्, म तपाईंलाई इन्जिनियरिङ सेवाको बारेमा के जानकारी दिऊँ?";
            }

            chat.innerHTML += `<div class="msg bot"><b>AI:</b> ${reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 800);
    }
</script>

</body>
</html>
